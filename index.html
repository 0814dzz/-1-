<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泡泡消消乐 · 中英配对</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 16px;
        }
        .game-container {
            width: 100%;
            max-width: 1100px;
            background: white;
            border-radius: 48px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.03);
            padding: 24px 24px 30px;
        }
        h1 {
            text-align: center;
            font-weight: 400;
            font-size: 2.2rem;
            letter-spacing: 2px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        h1 span {
            font-weight: 300;
            color: #7f8c8d;
        }
        /* 泡泡网格 */
        .bubble-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 22px 16px;
            justify-items: center;
            align-items: center;
            margin: 30px 0 40px;
            padding: 10px 5px;
        }
        /* 3D泡泡公用样式 */
        .bubble {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 160px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
            padding: 0 6px;
            word-break: break-word;
            cursor: pointer;
            transition: transform 0.1s ease, filter 0.2s, box-shadow 0.15s;
            /* 3D立体核心 */
            box-shadow: 
                0 20px 18px -8px rgba(0, 0, 0, 0.3),
                0 0 0 2px rgba(255, 255, 255, 0.6) inset,
                0 -8px 12px rgba(0, 0, 0, 0.2) inset,
                8px 10px 12px rgba(255, 255, 255, 0.7) inset;
            background: radial-gradient(circle at 30% 28%, rgba(255, 255, 255, 0.9) 5%, rgba(200, 225, 255, 0.2) 70%);
            will-change: transform;
            color: #0a1a2a;
            text-shadow: 0 2px 3px rgba(255,255,255,0.5);
            line-height: 1.3;
        }
        /* 增强3D凹凸感 */
        .bubble::after {
            content: "";
            position: absolute;
            width: 22%;
            height: 22%;
            top: 18%;
            left: 18%;
            background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.1) 80%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(1px);
        }
        .bubble {
            position: relative;
        }
        /* 英文深蓝色泡泡 */
        .bubble.english {
            background-color: #1a3b5d;  /* 深蓝底色 */
            background: radial-gradient(circle at 30% 28%, #98b9e6 5%, #0f2b4a 90%);
            box-shadow: 
                0 20px 18px -8px rgba(0,0,0,0.4),
                0 0 0 2px rgba(255, 255, 255, 0.5) inset,
                0 -8px 12px #071a2b inset,
                8px 10px 12px rgba(220, 235, 255, 0.8) inset;
            color: #f0f7ff;
            text-shadow: 0 2px 3px #00000040;
        }
        /* 中文浅蓝色泡泡 */
        .bubble.chinese {
            background-color: #a0c9f0;
            background: radial-gradient(circle at 30% 28%, #f0f9ff 5%, #89b9e6 90%);
            box-shadow: 
                0 20px 18px -8px rgba(0, 0, 0, 0.25),
                0 0 0 2px rgba(255, 255, 255, 0.8) inset,
                0 -8px 12px #5f8fc0 inset,
                8px 10px 12px rgba(255, 255, 255, 0.9) inset;
            color: #022b49;
            text-shadow: 0 1px 2px white;
        }
        /* 选中高亮效果 */
        .bubble.selected {
            filter: brightness(1.2);
            transform: scale(1.04);
            box-shadow: 
                0 22px 20px -6px black,
                0 0 0 4px #f9f3b0 inset,
                0 -6px 12px rgba(0,0,0,0.4) inset,
                8px 10px 12px rgba(255, 255, 255, 0.9) inset;
            transition: all 0.12s;
            z-index: 3;
        }
        /* 消除的泡泡直接隐藏 (保留占位但不可见，保持网格稳定) */
        .bubble.matched {
            opacity: 0;
            pointer-events: none;
            cursor: default;
            box-shadow: none;
            background: transparent !important;
            transition: opacity 0.2s;
        }
        .bubble.matched::after {
            opacity: 0;
        }
        /* 底部按钮 */
        .bottom-panel {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .shuffle-btn {
            background: white;
            border: 2px solid #d0ddee;
            border-radius: 60px;
            padding: 18px 60px;
            font-size: 1.8rem;
            font-weight: 350;
            color: #2c5282;
            letter-spacing: 2px;
            box-shadow: 0 10px 18px rgba(0, 30, 50, 0.1), 0 0 0 1px #ffffff inset, 0 -4px 6px #ccddec inset;
            cursor: pointer;
            transition: all 0.15s;
            background: #f4f9ff;
        }
        .shuffle-btn:hover {
            background: #e6f0fe;
            box-shadow: 0 14px 22px rgba(0, 40, 60, 0.15), 0 0 0 2px #aac3df inset;
            transform: translateY(-3px);
        }
        .shuffle-btn:active {
            transform: translateY(2px);
            box-shadow: 0 6px 10px rgba(0,0,0,0.1), 0 0 0 1px #89a9cc inset;
        }
        /* 状态信息 */
        .info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            color: #3a5670;
            padding: 0 15px;
            font-weight: 400;
        }
        .counter {
            background: #eaf1fb;
            border-radius: 40px;
            padding: 8px 22px;
            box-shadow: inset 0 1px 4px #b0c6dd;
        }
        /* 适配小屏 */
        @media (max-width: 700px) {
            .bubble-grid {
                gap: 12px 8px;
            }
            .bubble {
                font-size: 0.8rem;
            }
            .shuffle-btn {
                padding: 14px 35px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🌊 bubble·match <span>消消乐</span></h1>
    <div class="info-bar">
        <div class="counter" id="remainCounter">剩余 20 对</div>
        <div style="color:#4f6f8f;">✧ 英文深蓝 ✧ 中文浅蓝</div>
    </div>

    <!-- 泡泡网格 5x8 = 40个 (20对) -->
    <div class="bubble-grid" id="bubbleGrid"></div>

    <div class="bottom-panel">
        <button class="shuffle-btn" id="shuffleBtn">⟳ 重排泡泡</button>
    </div>
</div>

<script>
    (function() {
        // ----- 中英文对照词表 (20对) -----
        const PAIRS = [
            { english: "loose", chinese: "松动的" },
            { english: "dusty", chinese: "落满尘埃的" },
            { english: "curtain", chinese: "窗帘" },
            { english: "teenager", chinese: "青少年" },
            { english: "pack up", chinese: "打包" },
            { english: "overcoat", chinese: "外套" },
            { english: "suitcase", chinese: "手提箱" },
            { english: "at dusk", chinese: "傍晚；黄昏时候" },
            { english: "thunder", chinese: "雷" },
            { english: "lightning", chinese: "闪电" },
            { english: "outdoors", chinese: "户外" },
            { english: "be tired of", chinese: "厌烦" },
            { english: "go through", chinese: "经历，忍受" },
            { english: "get along with", chinese: "有进展；和...相处" },
            { english: "dislike", chinese: "不喜欢" },
            { english: "join in", chinese: "参加" },
            { english: "ignore", chinese: "忽视" },
            { english: "on purpose", chinese: "故意地" },
            { english: "add up to", chinese: "合计达" },
            { english: "be concerned about", chinese: "关心" },
            { english: "calm down", chinese: "平静下来；冷静下来" },
            { english: "fall in love with", chinese: "爱上" }
        ];

        // 构建原始泡泡数据 (每个对象包含: id, pairId, type, text)
        function buildItemList() {
            const items = [];
            PAIRS.forEach((pair, idx) => {
                // 英文泡泡
                items.push({
                    uniqueId: `e-${idx}-${Date.now()}-${Math.random()}`,
                    pairId: idx,
                    type: 'english',
                    text: pair.english,
                });
                // 中文泡泡
                items.push({
                    uniqueId: `c-${idx}-${Date.now()}-${Math.random()}`,
                    pairId: idx,
                    type: 'chinese',
                    text: pair.chinese,
                });
            });
            return items;
        }

        // 随机打乱数组 (Fisher–Yates)
        function shuffleArray(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // 游戏状态
        let currentItems = [];               // 当前显示顺序(原始对象引用)
        let selectedBubble = null;           // 存 { index, element, pairId, type }
        let matchInProgress = false;          // 简单防连点 (忽略快速点击第三个)

        const grid = document.getElementById('bubbleGrid');
        const remainSpan = document.getElementById('remainCounter');

        // 渲染网格 (根据 currentItems)
        function renderBoard() {
            // 清除所有子节点
            grid.innerHTML = '';

            currentItems.forEach((item, index) => {
                const bubbleDiv = document.createElement('div');
                bubbleDiv.className = `bubble ${item.type}`;  // english 或 chinese
                bubbleDiv.textContent = item.text;
                // 储存 item 唯一标识和配对id便于快速查找
                bubbleDiv.dataset.index = index;
                bubbleDiv.dataset.pairId = item.pairId;
                bubbleDiv.dataset.type = item.type;
                bubbleDiv.dataset.unique = item.uniqueId;
                bubbleDiv.dataset.matched = 'false';   // 自定义属性标记是否已消除

                // 点击事件直接绑定（也可委托，但简单直接）
                bubbleDiv.addEventListener('click', bubbleClickHandler);
                grid.appendChild(bubbleDiv);
            });

            // 清除任何残留选中状态
            clearSelectedHighlight();
            selectedBubble = null;

            // 更新剩余计数 (matched 泡泡不计)
            updateRemainCount();
        }

        // 更新剩余未消除对数 (两个都未消除才算一对)
        function updateRemainCount() {
            const allBubbles = document.querySelectorAll('.bubble');
            let matchedCount = 0;
            allBubbles.forEach(bubble => {
                if (bubble.classList.contains('matched')) matchedCount++;
            });
            const remainPairs = (allBubbles.length - matchedCount) / 2;
            remainSpan.textContent = `剩余 ${remainPairs} 对`;
        }

        // 清除所有高亮
        function clearSelectedHighlight() {
            document.querySelectorAll('.bubble.selected').forEach(b => b.classList.remove('selected'));
        }

        // 点击处理器
        function bubbleClickHandler(e) {
            const currentBubble = e.currentTarget;
            // 如果已经消除，忽略点击
            if (currentBubble.classList.contains('matched')) return;

            // 情况1: 没有选中任何泡泡 -> 选中当前泡泡 (英文才可以作为第一个? 规则: 英文先，但也可以兼容中文先? 我们尊重玩法: 英文先点，但万一先点中文就提示? 更友好: 允许任意先点，但配对必须是英+中。 如果第一个点中文，我们仍选中，但第二个点英文也会判断。不过为避免混乱，仍然可以。但消除条件：英文pairId == 中文pairId。所以两种顺序都行。)
            if (!selectedBubble) {
                // 清除可能遗留的高亮
                clearSelectedHighlight();
                currentBubble.classList.add('selected');
                selectedBubble = {
                    element: currentBubble,
                    index: parseInt(currentBubble.dataset.index),
                    pairId: parseInt(currentBubble.dataset.pairId),
                    type: currentBubble.dataset.type,
                };
                return;
            }

            // 情况2: 已经选中了一个泡泡
            // 如果点击的是同一个泡泡 -> 取消选中
            if (selectedBubble.element === currentBubble) {
                clearSelectedHighlight();
                selectedBubble = null;
                return;
            }

            // 点击不同泡泡
            const first = selectedBubble;
            const second = {
                element: currentBubble,
                index: parseInt(currentBubble.dataset.index),
                pairId: parseInt(currentBubble.dataset.pairId),
                type: currentBubble.dataset.type,
            };

            // 如果两个泡泡类型相同，则不能消除 -> 放弃之前的选中，将新点击的设为选中(切换)
            if (first.type === second.type) {
                // 相同类型: 取消原高亮，高亮新泡泡
                clearSelectedHighlight();
                currentBubble.classList.add('selected');
                selectedBubble = {
                    element: currentBubble,
                    index: second.index,
                    pairId: second.pairId,
                    type: second.type,
                };
                return;
            }

            // 类型不同: 一个是英文一个是中文，检查配对
            // 确保 pairId 一致
            if (first.pairId === second.pairId) {
                // 配对正确 → 消除两个泡泡
                // 加一点视觉反馈，然后标记为matched
                first.element.classList.add('matched');
                second.element.classList.add('matched');
                // 移除高亮
                clearSelectedHighlight();
                selectedBubble = null;

                // 更新剩余计数
                updateRemainCount();
            } else {
                // 配对错误：不清除，只取消选中和高亮，但不消除
                clearSelectedHighlight();
                selectedBubble = null;
                // 可选轻微抖动提示，为了友好，不加也可以
            }
        }

        // 重置/重新打乱 (保留所有未消除泡泡的排序)
        function reshuffle() {
            // 收集当前还未消除的item (根据DOM中的matched状态)
            const unmatchedItems = [];
            const bubbles = document.querySelectorAll('.bubble');

            bubbles.forEach(bubble => {
                // 如果未消除 (没有matched类)
                if (!bubble.classList.contains('matched')) {
                    const pairId = parseInt(bubble.dataset.pairId);
                    const type = bubble.dataset.type;
                    const text = bubble.textContent; // 原始文本
                    // 重新构建item (用uniqueId吗？为了保证后续点击一致性，重新生成也可以，但pair关系和文本不变)
                    // 简单根据已有的dataset重新生成对象，保证引用干净
                    unmatchedItems.push({
                        uniqueId: bubble.dataset.unique || `new-${Math.random()}`,
                        pairId: pairId,
                        type: type,
                        text: text,
                    });
                }
            });

            // 打乱未消除的泡泡
            const shuffled = shuffleArray(unmatchedItems);
            // 更新 currentItems 为 shuffled
            currentItems = shuffled;

            // 重新渲染网格 (此时所有保留的泡泡被打乱，且matched类消失，因为全新dom)
            renderBoard();
        }

        // 初始化游戏 (首轮)
        function initGame() {
            // 生成原始20对，打乱
            const rawItems = buildItemList();   // 40个
            currentItems = shuffleArray(rawItems);
            renderBoard();
        }

        // 绑定重排按钮
        document.getElementById('shuffleBtn').addEventListener('click', () => {
            // 重排时，已消除的泡泡不参与 (保留消除进度)
            reshuffle();
        });

        // 开始
        initGame();

        // 附加: 点击空白区域清除选中? (不需要)
        // 但为了防止误触，保留功能。 点击背景不清除。
    })();
</script>
</body>
</html>
