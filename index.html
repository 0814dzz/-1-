<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深蓝·浅蓝 · 英文消消乐</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* 避免拖动选中文字 */
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: white;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 2rem;
            padding: 1.5rem 1rem 1rem 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 网格布局：5列，每个单元格固定大小，自动换行 */
        .bubble-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem 0.8rem;
            justify-items: center;
            align-items: center;
            width: 100%;
            margin: 1rem 0 1.5rem 0;
            padding: 0.5rem;
        }

        /* 泡泡基础样式 —— 真正的3D立体球效果 */
        .bubble {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
            padding: 0.4rem;
            word-break: break-word;
            box-shadow: 0 15px 0 rgba(0, 0, 0, 0.12),      /* 底部厚重投影制造立体悬浮感 */
                        0 10px 20px rgba(0, 0, 0, 0.2),
                        inset 0 -8px 8px rgba(0, 0, 0, 0.2),   /* 内凹阴影 */
                        inset 0 8px 10px rgba(255, 255, 255, 0.7); /* 顶部强烈高光 */
            transition: transform 0.1s ease, box-shadow 0.15s ease;
            cursor: pointer;
            will-change: transform;
            color: #1e2b3a; /* 基础文字色，具体由具体颜色覆盖 */
            position: relative;
        }

        /* 英文泡泡：深蓝立体 */
        .bubble.en {
            background: radial-gradient(circle at 30% 28%, #6d8fc6, #0a2647); /* 深蓝高光 */
            color: white;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            box-shadow: 0 15px 0 #082032,
                        0 12px 18px rgba(0,0,0,0.35),
                        inset 0 -8px 8px rgba(0,0,0,0.5),
                        inset 0 8px 12px rgba(255, 255, 255, 0.6);
        }

        /* 中文泡泡：浅蓝立体 */
        .bubble.zh {
            background: radial-gradient(circle at 30% 28%, #f0faff, #7ec8e0); /* 浅蓝高光 */
            color: #003153;
            font-weight: 550;
            text-shadow: 0 1px 2px rgba(255,255,255,0.6);
            box-shadow: 0 15px 0 #3b8ba0,
                        0 12px 18px rgba(0,0,0,0.2),
                        inset 0 -8px 8px rgba(0, 50, 70, 0.2),
                        inset 0 8px 12px rgba(255, 255, 255, 0.9);
        }

        /* 选中高亮效果：用金色外圈 + 轻微放大 */
        .bubble.selected {
            box-shadow: 0 0 0 4px gold, 0 18px 0 rgba(0, 0, 0, 0.15), 0 12px 20px rgba(0,0,0,0.25), inset 0 -8px 8px rgba(0,0,0,0.2), inset 0 8px 12px rgba(255,255,255,0.8);
            transform: scale(1.02);
            transition: all 0.1s;
            z-index: 5;
        }

        /* 错误提示快速闪红 (加在泡泡上) */
        .bubble.error {
            background: radial-gradient(circle at 30% 28%, #ffb0b0, #b22) !important;
            box-shadow: 0 0 0 3px red, 0 15px 0 #5a2e2e !important;
            transition: 0.05s;
        }

        /* 底部按钮 */
        .reset-button {
            background: #f2f6fc;
            border: 2px solid #cbd5e1;
            font-size: 1.5rem;
            font-weight: 600;
            padding: 0.8rem 2.5rem;
            border-radius: 3rem;
            color: #0b2b4a;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 0 #a0b3c9, 0 6px 15px rgba(0,0,0,0.1);
            transition: all 0.08s linear;
            margin-top: 0.5rem;
            width: fit-content;
        }

        .reset-button:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #a0b3c9, 0 6px 15px rgba(0,0,0,0.1);
        }

        /* 网格单元格内部居中，防止意外挤压 */
        .bubble-grid > * {
            max-width: 100px;
            max-height: 100px;
        }

        /* 提示小字 */
        .hint {
            color: #596f88;
            font-size: 0.95rem;
            margin: 0.2rem 0 0.3rem;
        }

        /* 空白格子占位（没有泡泡时隐藏占位，但grid单元格仍然存在） */
        .bubble-grid .placeholder {
            visibility: hidden;
            pointer-events: none;
        }

        footer {
            font-size: 0.8rem;
            color: #9aaec2;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h2 style="margin:0; color:#1e3a5f;">🌊 单词泡泡配对 · 中英文消消乐</h2>
        <div class="hint">🔵 点击深蓝英文，再点击浅蓝中文 (相同意思消除)</div>

        <!-- 泡泡网格容器 5列 -->
        <div class="bubble-grid" id="bubbleGrid"></div>

        <!-- 底部重置按钮 (重复功能) -->
        <button class="reset-button" id="resetBtn">🔄 重新洗牌</button>
        <footer style="margin-top: 10px;">深蓝=英文 | 浅蓝=中文</footer>
    </div>

    <script>
        (function() {
            // ---------- 词库 ----------
            const pairs = [
                { english: "voyage", chinese: "航行；航海" },
                { english: "play a part in", chinese: "在……中起作用；扮演角色" },
                { english: "at present", chinese: "目前；现在" },
                { english: "frequently", chinese: "频繁地；经常" },
                { english: "official", chinese: "官方的；正式的" },
                { english: "such as", chinese: "比如；诸如" },
                { english: "base on", chinese: "以……为基础" },
                { english: "native", chinese: "本国的；本地人" },
                { english: "actually", chinese: "实际上；事实上" },
                { english: "accent", chinese: "口音" },
                { english: "spelling", chinese: "拼写" },
                { english: "vocabulary", chinese: "词汇；词汇量" },
                { english: "because of", chinese: "因为" },
                { english: "make use of", chinese: "利用" },
                { english: "fluently", chinese: "流利地" },
                { english: "command", chinese: "命令；指令" },
                { english: "recognize", chinese: "认出；辨认" },
                { english: "identity", chinese: "身份" },
                { english: "latter", chinese: "后者的" },
                { english: "suggest", chinese: "建议；暗示" }
            ];

            // ---------- 全局变量 ----------
            const grid = document.getElementById('bubbleGrid');
            const resetBtn = document.getElementById('resetBtn');

            let selectedBubble = null;                // 当前高亮的泡泡DOM
            let audioContext = null;                   // 用于音效的Web Audio上下文

            // ---------- 生成原始泡泡数据 (包含英文和中文，未打乱) ----------
            function generateRawBubbles() {
                const bubbles = [];
                pairs.forEach((pair, idx) => {
                    // 英文泡泡
                    bubbles.push({
                        id: `e-${idx}-${Date.now()}-${Math.random()}`,
                        type: 'en',
                        text: pair.english,
                        pairId: idx
                    });
                    // 中文泡泡
                    bubbles.push({
                        id: `c-${idx}-${Date.now()}-${Math.random()}`,
                        type: 'zh',
                        text: pair.chinese,
                        pairId: idx
                    });
                });
                return bubbles;
            }

            // ---------- Fisher-Yates 洗牌 ----------
            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            // ---------- 播放消除音效 (web audio 合成短促pop) ----------
            function playPopSound() {
                try {
                    // 延迟初始化AudioContext，确保在用户手势后
                    if (!audioContext) {
                        audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    if (audioContext.state === 'suspended') {
                        audioContext.resume().then(() => playSound()).catch(() => {});
                    } else {
                        playSound();
                    }
                } catch (e) {
                    console.warn("音效无法播放:", e);
                }

                function playSound() {
                    if (!audioContext) return;
                    const now = audioContext.currentTime;
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();

                    osc.type = 'sine';
                    osc.frequency.value = 520; // 轻快pop

                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    osc.start(now);
                    osc.stop(now + 0.12);
                }
            }

            // ---------- 清除高亮 ----------
            function clearSelected() {
                if (selectedBubble) {
                    selectedBubble.classList.remove('selected');
                    selectedBubble = null;
                }
            }

            // ---------- 给两个泡泡添加错误闪红 (短暂) ----------
            function flashError(bubbleA, bubbleB) {
                [bubbleA, bubbleB].forEach(b => {
                    if (b && b.classList) {
                        b.classList.add('error');
                        setTimeout(() => {
                            b.classList.remove('error');
                        }, 200);
                    }
                });
            }

            // ---------- 渲染网格 (根据打乱后的数据) ----------
            function renderGrid(bubbles) {
                // 移除所有子节点
                while (grid.firstChild) {
                    grid.removeChild(grid.firstChild);
                }

                // 根据打乱顺序创建泡泡dom
                bubbles.forEach(item => {
                    const bubbleDiv = document.createElement('div');
                    bubbleDiv.className = `bubble ${item.type}`; // en 或 zh
                    bubbleDiv.textContent = item.text;
                    // 存储必要数据
                    bubbleDiv.dataset.type = item.type;
                    bubbleDiv.dataset.pairId = item.pairId;
                    bubbleDiv.dataset.id = item.id;      // 可选唯一标识
                    // 为了显示统一，可以添加title提示（可选）
                    bubbleDiv.title = item.type === 'en' ? '英文' : '中文';
                    grid.appendChild(bubbleDiv);
                });

                // 确保网格永远是40个格子，但因为我们正好40个泡泡，无需补全
                // 万一由于某些原因少于40? 不会的。但以防万一，补空白占位保持grid稳定
                const currentCount = grid.children.length;
                if (currentCount < 40) {
                    for (let i = 0; i < 40 - currentCount; i++) {
                        const empty = document.createElement('div');
                        empty.style.visibility = 'hidden';
                        empty.style.pointerEvents = 'none';
                        empty.style.height = '100px';
                        grid.appendChild(empty);
                    }
                }
            }

            // ---------- 重置/开始新游戏 (打乱并渲染) ----------
            function resetGame() {
                // 清除选中
                clearSelected();

                // 生成原始数据 -> 打乱
                const raw = generateRawBubbles();
                const shuffled = shuffleArray(raw);
                renderGrid(shuffled);
            }

            // ---------- 网格点击事件代理 (处理所有泡泡点击) ----------
            grid.addEventListener('click', (e) => {
                // 获取实际点击的泡泡元素（通过closest）
                const bubble = e.target.closest('.bubble');
                if (!bubble) return; // 点击间隙或占位

                // 检查是否已被消除？如果不在DOM树中其实不会触发，但以防万一
                if (!grid.contains(bubble)) return;

                // 如果之前选中的元素已经被移除（比如通过消除），需要清除指针
                if (selectedBubble && !grid.contains(selectedBubble)) {
                    selectedBubble = null;
                }

                // 读取泡泡数据
                const currentType = bubble.dataset.type;
                const currentPairId = bubble.dataset.pairId;

                // 情况1：没有选中任何泡泡
                if (!selectedBubble) {
                    // 直接选中当前泡泡，添加高亮
                    bubble.classList.add('selected');
                    selectedBubble = bubble;
                    return;
                }

                // 情况2：已经选中了一个泡泡 (selectedBubble存在)
                const selectedType = selectedBubble.dataset.type;
                const selectedPairId = selectedBubble.dataset.pairId;

                // 如果点击的是同一个泡泡 => 取消选中
                if (selectedBubble === bubble) {
                    clearSelected();
                    return;
                }

                // 点击不同泡泡，检查类型是否不同 (一个英文一个中文)
                if (selectedType !== currentType) {
                    // 类型不同，构成配对尝试
                    if (selectedPairId === currentPairId) {
                        // 配对成功！消除两个泡泡
                        // 1. 播放音效
                        playPopSound();

                        // 2. 从DOM移除两个泡泡
                        selectedBubble.remove();
                        bubble.remove();

                        // 3. 清除选中 (已经移除了)
                        selectedBubble = null;

                        // 4. 可选的：检查是否所有泡泡都没了？不需要，等待重置即可
                    } else {
                        // 配对失败：闪红提示 + 清除选中
                        flashError(selectedBubble, bubble);
                        // 移除之前高亮
                        clearSelected(); // 清除高亮并置空
                        // 注意：当前点击的泡泡也不应该被选中，所以没有新选中
                    }
                } else {
                    // 类型相同 (两个英文 或 两个中文) => 切换选中为当前泡泡
                    // 先清除之前的高亮
                    clearSelected();
                    // 高亮新的泡泡
                    bubble.classList.add('selected');
                    selectedBubble = bubble;
                }
            });

            // ---------- 重置按钮 ----------
            resetBtn.addEventListener('click', () => {
                resetGame();
                // 同时确保选中的清除干净
                clearSelected();
                // 如果之前有音频上下文挂起，不需要特别处理
            });

            // ---------- 初始化游戏 ----------
            resetGame();

            // ---------- 额外：处理AudioContext自动恢复 (某些浏览器限制) ----------
            // 在第一次用户交互时激活音频上下文 (但我们在播放时已经处理resume)
            // 为了更稳健，可以加一个全局初始化手势（但消除时才会触发播放，已经存在手势）
            // 为了防止点击重置按钮也开启音频上下文？但重置不播放音效，无碍。
            // 注册一个预热函数 (点击任意地方但仅一次)
            function warmUpAudio() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioContext.state === 'suspended') {
                    audioContext.resume().then(() => {
                        // 短暂打开后静默即可
                    }).catch(()=>{});
                }
                document.removeEventListener('click', warmUpAudio);
            }
            document.addEventListener('click', warmUpAudio, { once: true });
        })();
    </script>
</body>
</html>
